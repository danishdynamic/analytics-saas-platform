version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL
      - CELERY_BROKER_URL
      - REDIS_URL
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - db
      - rabbitmq
      - redis

  worker:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL
      - CELERY_BROKER_URL
      - REDIS_URL
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      - db
      - rabbitmq
      - redis

volumes:
  db_data:
